<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} — tbr PRO</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="card login-card" style="max-width: 440px;">
        <div style="display:flex; justify-content:center; margin-bottom:12px;">
            <svg class="logo-svg" style="width:54px; height:54px;" viewBox="0 0 48 48" fill="none">
                <rect width="48" height="48" rx="12" fill="#1A1A20" stroke="#2ecc71" stroke-width="2"/>
                <path d="M26 6L12 26H24L20 42L36 22H24L26 6Z" fill="#2ECC71"/>
            </svg>
        </div>
        <div class="login-title" style="font-size:2.4rem; margin-bottom:4px;">{{ code }}</div>
        <div style="font-weight:700; font-size:15px; margin-bottom:8px;">{{ title }}</div>
        <p class="muted-text" style="margin-bottom:18px; line-height:1.5;">{{ message }}</p>
        <a href="/" class="btn w-full center-btn">⚡ Вернуться на базу</a>
    </div>
</body>
</html>
